server {
    listen 80;
    
    # Ganti dengan nama domain atau subdomain Anda
    server_name matapadi.pbjt.web.id;

    # Gunakan DNS internal Docker Swarm
    resolver 127.0.0.11 valid=30s;

    location / {
        # 'abress_web' adalah [nama-stack]_[nama-service-di-compose]
        # Pastikan docker-compose Anda di deploy dengan nama stack 'abress'
        set $upstream http://abress_web:3000;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SvelteKit terkadang butuh pengaturan WebSockets/SSE jika nanti diaktifkan
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
